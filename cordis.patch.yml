# @hazlank/dsh-session-tabs bundle patch: insert the dual-face plugin row into
# the web profile roster.
#
#   host half    exports "."        -> loopback tab-state routes
#                                     (GET/POST /api/dsh-session-tabs/state)
#   browser half exports "./client" -> the tab strip itself, loaded through
#                                     package.json `dsh.client`
#
# Install from npm (or the desktop Plugins page):
#   dsh plugin --profile <name> add @hazlank/dsh-session-tabs
- insert:
    - id: session-tabs
      name: '@hazlank/dsh-session-tabs'
